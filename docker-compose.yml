services:
  web:
    build:
      context: ./apps/web
    environment:
      PORTAL_ADMIN_PASSWORD: ${PORTAL_ADMIN_PASSWORD:-}
    ports:
      - "${PORTAL_HTTP_PORT:-8080}:80"
    depends_on:
      - app-api
    restart: unless-stopped

  app-api:
    build:
      context: ./apps/app-api
    env_file:
      - path: ${PODOCRACY_ENV_FILE:-.env}
        required: false
    environment:
      PROJECTS_DIR: /data/projects
    volumes:
      - type: bind
        source: ${PODOCRACY_PROJECTS_DIR:-./data/projects}
        target: /data/projects
    # Lets the containers reach a TTS server bound to the host (VIBEVOICE_BASE_URL).
    # Docker Desktop resolves this natively; Linux and Colima need the explicit mapping.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    expose:
      - "8000"
    restart: unless-stopped

  worker:
    build:
      context: ./worker
    env_file:
      - path: ${PODOCRACY_ENV_FILE:-.env}
        required: false
    environment:
      PROJECTS_DIR: /data/projects
      WORKER_POLL_SECONDS: ${WORKER_POLL_SECONDS:-3}
    volumes:
      - type: bind
        source: ${PODOCRACY_PROJECTS_DIR:-./data/projects}
        target: /data/projects
      - pyannote-cache:/root/.cache/huggingface
    # Lets the containers reach a TTS server bound to the host (VIBEVOICE_BASE_URL).
    # Docker Desktop resolves this natively; Linux and Colima need the explicit mapping.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - app-api
    restart: unless-stopped

volumes:
  pyannote-cache:
